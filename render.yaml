services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service (Render)
  # ---------------------------------------------------------------------------
  - type: web
    name: quickchex-backend
    runtime: python
    rootDir: Attendance-portal/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      # Paste your Neon Connection String in the Render Dashboard for DATABASE_URL:
      - key: DATABASE_URL
        sync: false
      - key: ALLOW_SQLITE_DEV_FALLBACK
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: RUN_SCHEDULER
        value: "false"
      - key: CORS_ORIGINS
        value: "*" # Update with your frontend static site URL once created

  # ---------------------------------------------------------------------------
  # 2. React (Vite) Frontend Static Site (Render)
  # ---------------------------------------------------------------------------
  - type: static_site
    name: quickchex-frontend
    rootDir: Frontend/hrms-frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: quickchex-backend
          property: host
